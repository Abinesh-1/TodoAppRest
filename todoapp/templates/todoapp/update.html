<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Todo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark">
<div class="container mt-5 d-flex justify-content-center">
    <div class="card text-center" style="width: 40rem">
        <div class="card-header">
            Update Todo
        </div>

        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                
                <div class="input-group mb-3">
                    <span class="input-group-text">Title</span>
                    <input type="text" class="form-control" name="title" value="{{ todo.title }}" required>
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text">Description</span>
                    <textarea class="form-control" name="description" required>{{ todo.description }}</textarea>
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text">Status</span>
                    <select class="form-select" name="status" required>
                        <option value="Complete" {% if todo.status == 'Complete' %}selected{% endif %}>Complete</option>
                        <option value="Not complete" {% if todo.status == 'Not complete' %}selected{% endif %}>Not complete</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Update Todo</button>
                <a href="{% url 'todoapp:index' %}" class="btn btn-secondary">Back</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
