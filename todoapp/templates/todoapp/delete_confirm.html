<!DOCTYPE html>
<html>
<head>
    <title>Confirm Delete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">

<div class="container mt-5">
    <div class="card p-4">
        <h3 class="text-danger">Are you sure you want to delete this Todo?</h3>
        <hr>
        <p><strong>Title:</strong> {{ todo.title }}</p>
        <p><strong>Description:</strong> {{ todo.description }}</p>
        <p><strong>Status:</strong> {{ todo.status }}</p>

        <div class="mt-4">
            <a href="{% url 'todoapp:delete' todo.id %}" class="btn btn-danger">Yes, Delete</a>
            <a href="{% url 'todoapp:index' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </div>
</div>

</body>
</html>
